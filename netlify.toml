
# netlify.toml — customerserviceops.pagerduty.com
# This site now only redirects to docs.pagerduty.com/ops-guides/customer-service-ops.

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------
# These are attached to the 301 responses too. Referrer-Policy matters here:
# a redirect response's Referrer-Policy is applied to the follow-up request,
# so "same-origin" would strip the referrer when the browser goes on to
# docs.pagerduty.com (cross-origin), and docs analytics would lose the
# original traffic source (Google, blogs, Slack, etc.).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Redirects — first match wins. Keep the catch-all LAST.
# force = true is required because the old MkDocs build output (if still
# deployed) would otherwise shadow these rules.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops"
  status = 301
  force = true

[[redirects]]
  from = "/intro/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/introduction"
  status = 301
  force = true

[[redirects]]
  from = "/digitalorgs/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/digital-organizations"
  status = 301
  force = true

[[redirects]]
  from = "/sdlc/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/customer-service-in-sdlc"
  status = 301
  force = true

[[redirects]]
  from = "/incidents/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/customer-service-role-in-incidents"
  status = 301
  force = true

[[redirects]]
  from = "/metrics/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/metrics"
  status = 301
  force = true

[[redirects]]
  from = "/nextsteps/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/next-steps"
  status = 301
  force = true

[[redirects]]
  from = "/resources/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops/additional-resources"
  status = 301
  force = true

# Catch-all: assets, sitemap.xml, search index, unknown/mistyped URLs
[[redirects]]
  from = "/*"
  to = "https://docs.pagerduty.com/ops-guides/customer-service-ops"
  status = 301
  force = true
